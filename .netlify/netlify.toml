[plugins.inputs]

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://js.stripe.com https://cdn.tailwindcss.com https://assets.apollo.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://images.pexels.com https://cdn.jsdelivr.net https://brwzjwbpguiignrxvjdc.supabase.co https://brwzjwbpguiignrxvjdc.supabase.co/storage/v1/object/public/tenant-logos/; connect-src 'self' https://formspree.io https://brwzjwbpguiignrxvjdc.supabase.co https://api.allorigins.win https://api.stripe.com https://vpic.nhtsa.dot.gov https://assets.apollo.io https://oauth2.googleapis.com https://www.googleapis.com; media-src 'self' https://player.vimeo.com https://vimeo.com; frame-src https://player.vimeo.com https://js.stripe.com; frame-ancestors 'none';"

[[headers]]
