[build]
  command = "npm install square && npm run build"
  publish = ".next"

[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = ""

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    # X-XSS-Protection removed — deprecated in modern browsers, can cause issues in IE
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://js.stripe.com https://cdn.tailwindcss.com https://assets.apollo.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://images.pexels.com https://cdn.jsdelivr.net https://brwzjwbpguiignrxvjdc.supabase.co https://brwzjwbpguiignrxvjdc.supabase.co/storage/v1/object/public/tenant-logos/; connect-src 'self' https://formspree.io https://brwzjwbpguiignrxvjdc.supabase.co https://api.allorigins.win https://api.stripe.com https://vpic.nhtsa.dot.gov https://assets.apollo.io https://oauth2.googleapis.com https://www.googleapis.com; media-src 'self' https://player.vimeo.com https://vimeo.com; frame-src https://player.vimeo.com https://js.stripe.com; frame-ancestors 'none';"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# NOTE: These crons are now driven by Supabase pg_cron (net.http_get/http_post to
# /api/cron/*, secret from Supabase Vault), NOT Netlify — Netlify's scheduler
# silently stopped firing scheduled functions (2026-07-15). pg_cron jobs:
# poll-turo-emails (*/15), sync-ical (*/30), maintenance-alerts (0 13),
# review-requests (0 14), return-reminders (0 15), telematics-positions-prune (0 3).
# Schedules removed here to avoid double-firing (esp. email crons) if Netlify ever revives.
# telematics-sync has no HTTP endpoint, so it stays on Netlify for now.
[functions.telematics-sync]
  schedule = "*/5 * * * *"

# Edge Functions
[[edge_functions]]
  function = "playwright-bypass"
  path = "/*"

[[edge_functions]]
  function = "subdomain-rewrite"
  path = "/*"
